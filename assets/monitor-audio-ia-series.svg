<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Monitor Audio IA Series Q-SYS Plugin</title>
  <desc id="desc">Dark technical illustration of an IA Series installation amplifier connected to Q-SYS zones.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1f20"/>
      <stop offset="0.58" stop-color="#393d3a"/>
      <stop offset="1" stop-color="#586250"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#393d3a"/>
      <stop offset="1" stop-color="#1d1f1e"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d3d1c7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d3d1c7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#d3d1c7" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1360" cy="80" r="310" fill="#9d7f5e" opacity=".15"/>
  <circle cx="260" cy="830" r="260" fill="#7ba6b6" opacity=".09"/>

  <g transform="translate(108 118)">
    <rect width="610" height="118" rx="22" fill="#1d1f1e" stroke="#d3d1c7" stroke-opacity=".35"/>
    <rect x="28" y="27" width="8" height="64" rx="4" fill="#9d7f5e"/>
    <text x="62" y="54" fill="#d3d1c7" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="4">Q-SYS CONTROL</text>
    <text x="62" y="88" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">MONITOR AUDIO</text>
  </g>

  <g transform="translate(108 304)">
    <text fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="-2">IA SERIES</text>
    <text y="58" fill="#d3d1c7" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="2">INSTALLATION AMPLIFIER PLUGIN</text>
    <path d="M0 112H520" stroke="url(#cyanLine)" stroke-width="3"/>
    <text y="166" fill="#e3e2dd" font-family="Arial, Helvetica, sans-serif" font-size="23">Networked audio control for dependable spaces.</text>
  </g>

  <g transform="translate(108 608)">
    <g fill="#393d3a" stroke="#d3d1c7" stroke-opacity=".45">
      <rect width="178" height="62" rx="31"/>
      <rect x="196" width="178" height="62" rx="31"/>
      <rect x="392" width="178" height="62" rx="31"/>
    </g>
    <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">
      <text x="89" y="38">TCP/IP</text>
      <text x="285" y="38">ZONES</text>
      <text x="481" y="38">VOLUME + MUTE</text>
    </g>
  </g>

  <g transform="translate(790 230)">
    <path d="M0 208C74 128 114 292 184 208S294 128 368 208S478 292 552 208" fill="none" stroke="#9d7f5e" stroke-opacity=".3" stroke-width="24" filter="url(#glow)"/>
    <path d="M0 208C74 128 114 292 184 208S294 128 368 208S478 292 552 208" fill="none" stroke="#d3d1c7" stroke-width="4"/>
    <circle cx="0" cy="208" r="7" fill="#ffffff"/>
    <circle cx="552" cy="208" r="7" fill="#ffffff"/>

    <g transform="translate(36 326)">
      <rect width="540" height="230" rx="18" fill="url(#panel)" stroke="#d3d1c7" stroke-opacity=".6" stroke-width="2"/>
      <rect x="20" y="20" width="500" height="28" rx="8" fill="#1d1f1e"/>
      <circle cx="42" cy="34" r="5" fill="#7fa78b"/>
      <text x="61" y="40" fill="#d3d1c7" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2">IA AMPLIFIER / ONLINE</text>
      <text x="28" y="94" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">IA150-8C</text>
      <text x="28" y="122" fill="#d3d1c7" font-family="Arial, Helvetica, sans-serif" font-size="16">INSTALLATION SERIES</text>
      <g transform="translate(28 152)">
        <rect width="104" height="30" rx="6" fill="#586250"/>
        <rect x="116" width="104" height="30" rx="6" fill="#586250"/>
        <rect x="232" width="104" height="30" rx="6" fill="#586250"/>
        <rect x="348" width="104" height="30" rx="6" fill="#586250"/>
        <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
          <text x="52" y="20">ZONE 1</text>
          <text x="168" y="20">ZONE 2</text>
          <text x="284" y="20">ZONE 3</text>
          <text x="400" y="20">ZONE 4</text>
        </g>
      </g>
    </g>
  </g>

  <text x="1490" y="842" fill="#d3d1c7" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end" letter-spacing="3">Q-SYS PLUGIN • DEVELOPMENT</text>
</svg>
